<script>

/* ============ STATE & PERSISTENCE ============ */
const LS_KEY = 'zaffar_os_v1';
const todayStr = () => new Date().toISOString().slice(0,10);
const defState = () => ({
  profile: { name:'Zaffar', wake:'05:30', neetDate:'2027-05-03', level:1, joined: todayStr() },
  habits: [], habitLog: {},   // {date: {id: true|'missed'}}
  tests: [], mistakes: [], neet: {}, // neet: {subject: {chap: {done, pct}}}
  weight: [], measurements: [], workouts: [], sleep: [],
  photos: [], portfolio: {},
  chat: [], reviews: {}, situations: [],
  notif: {morning:true, study:true, workout:true, skincare:true, wisdom:true, evening:true},
  customNotifs: [], levelXp: 0
});
let S = defState();
try { const raw = localStorage.getItem(LS_KEY); if(raw) S = Object.assign(defState(), JSON.parse(raw)); } catch(e){}
const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){ toast('Storage full — export a backup'); } };

/* ============ DATA LIBRARIES ============ */
const LEVELS = ['The Awakening','The Disciplined','The Strategist','The Intellectual','The Charismatic','The Resilient','The Complete Zaffar'];
const WISDOM = [
 {t:"Knowledge is better than wealth. Knowledge guards its possessor, while wealth must be guarded. Wealth diminishes when spent; knowledge increases when shared.", src:"Attributed to Ali ibn Abi Talib — Nahj al-Balagha tradition", tag:"verified-attribution", topic:"knowledge", meaning:"What you learn becomes a permanent part of you; money can be lost, understanding cannot.", action:"Study one NEET concept deeply today — teach it to yourself out loud tonight."},
 {t:"Patience is of two kinds: patience over what pains you, and patience against what you desire.", src:"Attributed to Ali ibn Abi Talib — Nahj al-Balagha tradition", tag:"verified-attribution", topic:"patience", meaning:"Real sabr is not only enduring hardship — it is refusing the easy pleasure that derails your mission.", action:"Identify one impulse today (phone, comfort, excuse) and outlast it by one hour."},
 {t:"The tongue is like a lion. If you let it loose, it wounds.", src:"Attributed to Ali ibn Abi Talib — Nahj al-Balagha tradition", tag:"verified-attribution", topic:"silence", meaning:"Uncontrolled speech destroys relationships, reputation and focus faster than any enemy.", action:"Before your next conversation, pause three seconds before every reply."},
 {t:"Do not take someone's silence as ignorance, nor their calmness as acceptance, nor their smile as consent.", src:"Attributed to Ali ibn Abi Talib", tag:"attributed", topic:"relationships", meaning:"People reveal less than they know. Observe, don't assume — in exams and in life.", action:"In one conversation today, watch more than you speak."},
 {t:"He who knows himself knows his Lord.", src:"Attributed to Ali ibn Abi Talib — widely quoted in Islamic tradition", tag:"attributed", topic:"self-respect", meaning:"Honest self-knowledge — your flaws, fears and strengths — is the foundation of all growth.", action:"Write one true sentence about yourself tonight in the Daily Audit."},
 {t:"A man's measure is his determination — not his wealth or lineage.", src:"Attributed to Ali ibn Abi Talib", tag:"attributed", topic:"discipline", meaning:"Your background explains you; your will defines you.", action:"Complete today's hardest mission first, before anything easy."},
 {t:"The world is a place of passing, not a place of staying. Take from it what prepares you for the journey.", src:"Paraphrase of themes in Nahj al-Balagha", tag:"paraphrase", topic:"humility", meaning:"Marks, muscles and applause fade. Character and knowledge travel with you.", action:"Do one thing today for its own worth, not for how it looks."},
 {t:"Courage is not the absence of fear; it is the conquest of it.", src:"Reflection inspired by teachings attributed to Ali ibn Abi Talib", tag:"reflection", topic:"courage", meaning:"The brave man feels the same fear and walks forward anyway.", action:"Name the one thing you are avoiding today. Take the first small step toward it."},
 {t:"Justice is putting everything in its proper place.", src:"Paraphrase — attributed to Ali ibn Abi Talib", tag:"paraphrase", topic:"justice", meaning:"A just life gives each duty its right share: study its hours, body its training, soul its prayer.", action:"Audit today's schedule: is each part of your life getting what it deserves?"},
 {t:"Your remedy is within you, yet you do not perceive it; your ailment is from yourself, yet you do not see it.", src:"Attributed to Ali ibn Abi Talib — Nahj al-Balagha, Sermon 185", tag:"verified-attribution", topic:"knowledge", meaning:"Most obstacles are internal. The solution to distraction, doubt and delay begins with self-honesty.", action:"Identify one internal obstacle today and counter it with one concrete action."},
 {t:"Silence is the best answer to the foolish, the arrogant and the provocateur.", src:"Attributed to Ali ibn Abi Talib", tag:"attributed", topic:"silence", meaning:"Not every attack deserves a response. Composure is the highest dominance.", action:"The next time someone provokes you, respond with stillness, not speed."},
 {t:"He who does not know his own worth will accept less than he deserves.", src:"Attributed to Ali ibn Abi Talib", tag:"attributed", topic:"self-respect", meaning:"Low self-worth shows in how you carry yourself — your posture, your standards, your yes and no.", action:"Stand tall, speak slower, and decline one thing today that lowers your standard."}
];
const SUBJECTS = {
  Physics: ['Units & Measurement','Kinematics','Laws of Motion','Work, Energy & Power','Rotational Motion','Gravitation','Simple Harmonic Motion','Waves & Sound','Thermodynamics','Kinetic Theory','Ray Optics','Wave Optics','Electrostatics','Current Electricity','Magnetism','Electromagnetic Induction','Alternating Current','Modern Physics','Semiconductors'],
  Chemistry: ['Mole Concept','Atomic Structure','Chemical Bonding','States of Matter','Thermodynamics','Chemical & Ionic Equilibrium','Redox & Electrochemistry','Chemical Kinetics','P-Block Elements','D-Block & Coordination','Metallurgy','Hydrocarbons','Haloalkanes','Alcohols & Ethers','Aldehydes & Ketones','Carboxylic Acids','Amines','Biomolecules','Polymers'],
  Biology: ['Diversity of Life','Plant Kingdom','Animal Kingdom','Morphology of Plants','Anatomy of Plants','Cell: The Unit of Life','Cell Cycle & Division','Biomolecules','Photosynthesis','Respiration in Plants','Plant Growth & Development','Breathing & Exchange','Body Fluids & Circulation','Excretory System','Locomotion & Movement','Neural Control','Chemical Coordination','Reproduction in Organisms','Human Reproduction','Reproductive Health','Principles of Inheritance','Molecular Basis of Inheritance','Evolution','Human Health & Disease','Microbes & Biotechnology','Organisms & Populations','Ecosystem','Biotechnology Applications']
};
const EXERCISES = {
  intel: [
   {n:'Observational Walk', d:'Walk a familiar route. On return, list 10 details you never noticed before.', lvl:1},
   {n:'The Second-Order Question', d:'Take one current problem. Ask "and then what?" five times to trace consequences.', lvl:2},
   {n:'Logic Grid Puzzle', d:'Solve one grid logic puzzle (Einstein-style). Time yourself.', lvl:2},
   {n:'Fermi Estimate', d:'Estimate something ungoogleable (e.g., number of students studying for NEET right now). Show your steps.', lvl:3},
   {n:'Decision Matrix', d:'Take one real pending decision. List options × criteria, score 1–5 each, compute the answer.', lvl:2},
   {n:'Memory Palace', d:'Memorise a 12-item list using a memory palace. Recall it after 1 hour.', lvl:2},
   {n:'Steel-Man Exercise', d:'Argue the opposite of something you believe, as strongly as you can.', lvl:3}
  ],
  charisma: [
   {n:'The Slow Reply', d:'In your next three conversations, wait 2 seconds before every answer. Notice the authority it creates.', lvl:1},
   {n:'Story in 60 Seconds', d:'Record yourself telling a one-minute story with a clear beginning, tension and point.', lvl:2},
   {n:'Posture Audit', d:'Set 5 hourly alarms. Each one: shoulders back, chest open, chin level, breathe.', lvl:1},
   {n:'Voice Floor', d:'Read one paragraph aloud daily in your lowest comfortable pitch, at half your normal speed.', lvl:2},
   {n:'The Stranger Drill', d:'Make one brief friendly exchange with someone new (shopkeeper, classmate). Exit gracefully.', lvl:3},
   {n:'Disagreement Without Apology', d:'In one discussion, state a disagreement clearly, without "sorry" or hedging words.', lvl:2},
   {n:'Eye Contact Ladder', d:'Hold eye contact one second longer than comfortable, in every conversation today.', lvl:2}
  ]
};
const SEED_HABITS = [
 {id:'h1', name:'Fajr & Morning Adhkar', cat:'Spiritual development', time:'05:30'},
 {id:'h2', name:'NEET Deep Study Block (3h)', cat:'Academic excellence', time:'06:30'},
 {id:'h3', name:'Active Recall + Revision (1h)', cat:'Academic excellence', time:'10:00'},
 {id:'h4', name:'Workout — Project Moritz', cat:'Physical development', time:'17:00'},
 {id:'h5', name:'Intelligence Lab Exercise', cat:'Intelligence training', time:'19:00'},
 {id:'h6', name:'Charisma Lab Exercise', cat:'Charisma training', time:'19:20'},
 {id:'h7', name:'Skincare & Grooming', cat:'Appearance and grooming', time:'21:30'},
 {id:'h8', name:'Daily Audit — Nightly Review', cat:'Mental discipline', time:'22:30'},
 {id:'h9', name:'Sleep by 23:00 (Recovery)', cat:'Physical development', time:'23:00'}
];

/* ============ HELPERS ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/864e5);
const dateAdd = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function greetWord(){ const h=new Date().getHours(); return h<5?'The night is deep':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night'; }
const GREETINGS = ['Your next version is built by what you do today.','Fear none. Learn everything. Master yourself.','The man you decided to become is watching what you do now.','Discipline is choosing what you want most over what you want now.','One honest day at a time. That is the whole method.'];
const gidx = () => parseInt(todayStr().replace(/-/g,'')) % GREETINGS.length;

/* ============ SCORING ENGINE ============ */
function habitStats(){
  let done=0,total=0, streak=0;
  const today = todayStr();
  if(S.habitLog[today]) Object.values(S.habitLog[today]).forEach(v=>{ if(v===true) done++; total++; });
  // streak = consecutive days with >=60% completion
  let d = today;
  if(!S.habitLog[today]) d = dateAdd(d,-1);
  while(true){
    const log = S.habitLog[d]; const habs = S.habitLog[d] ? Object.keys(S.habitLog[d]).length : 0;
    if(habs===0) break;
    const c = Object.values(log).filter(v=>v===true).length;
    if(c/habs >= 0.6) { streak++; d = dateAdd(d,-1); } else break;
  }
  return {done,total,streak, score: total? Math.round(done/total*100) : 0};
}
function levelProgress(){
  const days = daysBetween(S.profile.joined, todayStr())+1;
  const ts = S.tests.length;
  const hs = habitStats();
  const reviews = Object.keys(S.reviews).length;
  const xp = days*2 + ts*5 + hs.streak*3 + reviews*2;
  const lvl = Math.min(7, 1+Math.floor(xp/40));
  return {xp, lvl};
}
function neetProgress(){
  let done=0,total=0; const subj={};
  Object.keys(SUBJECTS).forEach(s=>{ let d=0; SUBJECTS[s].forEach(c=>{ total++; if(S.neet[s]&&S.neet[s][c]&&S.neet[s][c].pct>=70) d++; }); done+=d; subj[s]=Math.round(d/SUBJECTS[s].length*100); });
  return {pct: total?Math.round(done/total*100):0, subj, remaining: total-done};
}
function weakAreas(){
  const out=[];
  Object.keys(SUBJECTS).forEach(s=> SUBJECTS[s].forEach(c=>{
    const r = S.neet[s]&&S.neet[s][c];
    if(r && r.pct>0 && r.pct<70) out.push({subj:s, chap:c, pct:r.pct});
  }));
  out.sort((a,b)=>a.pct-b.pct);
  return out.slice(0,6);
}

/* ============ ROUTER ============ */
let CUR = 'dashboard';
function go(view){
  if(!S.habits.length && view!=='dashboard'){} // allow all
  CUR = view;
  document.querySelectorAll('[id^="view-"]').forEach(v=>v.classList.add('hidden'));
  $('view-'+view).classList.remove('hidden');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on', b.dataset.nav===view));
  window.scrollTo({top:0});
  RENDER[view]();
}
function openAI(){ go('ai'); }

}

/* ============ DASHBOARD ============ */
function ring(pct,size,label){
  const r=(size/2)-6, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<div class="flex flex-col items-center gap-1">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">

  ensureHabits();

  S.habitLog[d][id] = val ? true : undefined;
  if(!val) delete S.habitLog[d][id];
  save(); if(CUR==='dashboard') renderDashboard(); if(CUR==='missions') renderMissions();
  if(val) toast('Mission complete. Identity earned, not given.');
}
function markMissed(id){
  const d = todayStr(); S.habitLog[d] = S.habitLog[d]||{}; S.habitLog[d][id]='missed'; save(); renderMissions();
}
function recoverHabit(id){
  const d = todayStr(); if(S.habitLog[d]) delete S.habitLog[d][id]; save(); renderMissions();

function missAnalysis(){
  const counts={};
  Object.entries(S.habitLog).forEach(([d,log])=>{ Object.entries(log).forEach(([id,v])=>{ if(v==='missed'){ const h=S.habits.find(x=>x.id===id); if(h) counts[h.cat]=(counts[h.cat]||0)+1; } }); });
  const entries=Object.entries(counts);
  if(!entries.length) return 'No missed missions recorded. When you do miss one, we analyse the pattern — timing, category, trigger — and rebuild the routine around it.';
  entries.sort((a,b)=>b[1]-a[1]);
  return `Most misses occur in <span class="gold">${esc(entries[0][0])}</span> (${entries[0][1]}×). Recommendation: shrink that mission to a 10-minute minimum version on low-energy days. Consistency of identity beats intensity of effort.`;
}

function setTimer(m){ if(!T) return; T.left=m*60; paintTimer(); }
function paintTimer(){ const f=$('timer-face'); if(!f||!T) return; const m=String(Math.floor(T.left/60)).padStart(2,'0'), s=String(T.left%60).padStart(2,'0'); f.textContent=`${m}:${s}`; }
function startStopTimer(){
  if(!T) return; const b=$('timer-btn');
  if(T.run){ clearInterval(T.iv); T.run=false; b.textContent='RESUME'; }
  else { T.run=true; b.textContent='PAUSE';
    T.iv=setInterval(()=>{ T.left--; paintTimer();
      if(T.left<=0){ clearInterval(T.iv); toast('Block complete. Close with 10 minutes of active recall.'); T.run=false; if($('timer-btn'))$('timer-btn').textContent='DONE'; }

}

  else if(/distract|focus|study|phone/.test(low)) theme='study';

  else if(/decision|confus|choose/.test(low)) theme='decision';
  const A={
   disrespect:{prof:`Analysis: your dignity is not under threat — your reaction is under your command. Best move: no retaliation today. Distance yourself, perform exceptionally, and let results answer the insult. Revenge is a tax on your NEET preparation.`,
    berlin:`Protocol: pause, square your shoulders, lower your voice one register, and respond once — briefly and without a smile: "Noted." Then exit the interaction first. Composure is the loudest dominance. Never explain, never chase.`,
    ali:`Ali (a.s.) taught: the tongue wounds like a lion when loose — keep yours leashed. Answer injustice with excellence. Your worth was never theirs to define. Guard your anger; it is a fire that burns its own house first.`,
    act:`Do nothing for 24 hours. Complete tomorrow's study block with full focus. The answer to disrespect is a rank.`},
   fear:{prof:`Fear is a forecast, not a fact. Write the worst case, the best case, the most likely case. The most likely is usually boring. Decide the smallest irreversible step and take it within 24 hours — momentum kills fear faster than motivation.`,
    berlin:`Fear shrinks when posture expands: chest open, breath low, eyes level. Speak your fear aloud once, then never again — confident men narrate plans, not worries. Walk into the feared thing slowly, but walk in.`,
    ali:`Courage is not the absence of fear; it is the conquest of it. Do the right thing while afraid — that is the whole definition of brave. What you fear losing was never fully yours; what you build with courage is.`,
    act:`Take the smallest first step within 24 hours. Then tell the AI mentor what you did.`},
   study:{prof:`Diagnose before treating: is it vague goals, low energy, or high friction? Cure respectively: one named chapter + one timer block; sleep and water before caffeine; phone in another room. Study the weakest chapter first while willpower is highest.`,
    berlin:`Treat distraction like an opponent in a negotiation: give it nothing. Phone outside the room, desk cleared, one paper open. Sit down before you feel ready — discipline is posture applied to time. Ninety focused minutes beats six guilty hours.`,
    ali:`The remedy is within you, yet you do not perceive it — the ailment is from yourself, yet you do not see it (Nahj al-Balagha tradition). Begin with one honest hour. Knowledge guards its possessor; every page is armour.`,
    act:`One 45-minute timer on your weakest chapter, phone in another room. Start now — not tonight.`},
   low:{prof:`Low states are physiological before they are philosophical: water, sunlight, ten minutes of movement, one completed small task. Mood follows action — act first, feel later. Tonight's audit will prove the day was not empty.`,
    berlin:`Never negotiate with a temporary mood. Stand tall, groom well, dress sharp — the body leads the mind. One conversation, one rep, one page: identity is built on days exactly like this one.`,
    ali:`Patience over what pains you, and patience against what you desire — both are required today. This heaviness is a test of sincerity, not a verdict on you. Pray, then move. Allah does not burden a soul beyond what it can bear (Qur'an 2:286).`,
    act:`Complete one tiny mission now (5 minutes). Then message the mentor with one word: "done."`},
   decision:{prof:`Define the decision in one sentence. List options. For each: reversibility, cost of being wrong, and what it teaches you regardless. Choose the option with the best worst-case — strategists optimise for regret, not for glory.`,
    berlin:`Decide as the man you are becoming, not the boy you were. Ask: which option would Level-7 Zaffar take? Then take it fully — half-decisions are the only bad decisions.`,
    ali:`Consult your knowledge, consult the wise, then decide with justice — putting everything in its proper place. A just decision gives each factor its right weight, then trusts Allah with the outcome.`,
    act:`Write the one-sentence decision and your chosen option in tonight's audit.`},
   discipline:{prof:`Missing one day is data; missing two is a pattern. Shrink the mission to a 10-minute floor for the next three days, attach it to an existing anchor (after Fajr, before dinner), and track only consistency — not intensity.`,
    berlin:`Stop announcing, start executing. The streak is a contract with yourself — a man who breaks small contracts breaks big ones. Do today's version now, smaller if needed, but unbroken.`,
    ali:`A man's measure is his determination. Today, win one small battle against the self — that is jihad al-nafs, the greater struggle, and it is won daily, not once.`,
    act:`Do the 10-minute version of your most-missed mission before you sleep tonight.`}
  }[theme];
  S.situations.push({date:todayStr(), q, theme}); save();
  $('sit-out').innerHTML = `
   <div class="card p-5 mb-3"><div class="text-[10px] tracking-[.25em] gold mb-2">🎓 THE PROFESSOR — STRATEGIC</div><div class="text-[13px] leading-relaxed" style="color:#cfc9bd">${esc(A.prof)}</div></div>

   <div class="card p-5 mb-3" style="border-color:#8a7442"><div class="text-[10px] tracking-[.25em] gold mb-2">🕌 MOLA ALI — THE SOUL'S WEIGHT</div><div class="text-[13px] leading-relaxed" style="color:#cfc9bd">${esc(A.ali)}</div></div>
   <div class="card p-5 glow" style="border-color:#c9a962"><div class="text-[10px] tracking-[.25em] gold mb-2">⚔ RECOMMENDED COURSE OF ACTION</div><div class="serif text-[16px]">${esc(A.act)}</div></div>`;

/* ============ ZAFFAR AI MENTOR ============ */
let aiMode='combined';
const MODE_META = {
  professor:{name:'THE PROFESSOR', icon:'🎓', desc:'Logic · strategy · NEET · decisions'},
  berlin:{name:'BERLIN', icon:'🎭', desc:'Confidence · presence · social intelligence'},
  ali:{name:'MOLA ALI', icon:'🕌', desc:'Wisdom · sabr · courage · justice'},
  combined:{name:'THE COUNCIL', icon:'⚔', desc:'All three minds together'}
};
function renderAI(){
  $('view-ai').innerHTML = `<div class="fade-in pt-6 flex flex-col" style="height:calc(100vh - 210px)">
    <div class="flex items-end justify-between">
      <div><div class="text-[11px] gold tracking-[.3em]">ZAFFAR AI</div>
      <h1 class="serif text-3xl mt-1">Your Mentor</h1></div>
    </div>
    <div class="flex gap-2 mt-3 mb-3 overflow-x-auto hide-scroll">
      ${Object.keys(MODE_META).map(k=>`<button class="chip ${k===aiMode?'on':''}" onclick="aiMode='${k}';renderAI()">${MODE_META[k].icon} ${MODE_META[k].name}</button>`).join('')}
    </div>
    <div class="card p-3 mb-2 text-[10px]" style="color:#8a8a94">${MODE_META[aiMode].desc} · remembers your progress across sessions</div>
    <div id="chat-box" class="flex-1 overflow-y-auto hide-scroll space-y-3 pr-1 pb-2"></div>
    <div class="flex gap-2 pt-2">
      <input id="chat-in" placeholder="Speak to ${MODE_META[aiMode].name}…" onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()" class="btn-gold px-5">➤</button>
    </div>
  </div>`;
  paintChat();
}
function paintChat(){
  const box=$('chat-box'); if(!box) return;
  if(!S.chat.length){
    box.innerHTML = `<div class="card p-4 msg-ai"><div class="text-[10px] tracking-widest gold mb-1">ZAFFAR AI</div>
    <div class="text-[13px]" style="color:#cfc9bd">Speak. I know your streaks, your tests, your misses. Advice here is built on your data, not on quotes.</div>
    <div class="flex gap-2 mt-3 flex-wrap">${['Plan my study day','I feel like quitting','How do I handle disrespect?','Analyse my last test','Give me a confidence drill'].map(s=>`<button class="chip" onclick="$('chat-in').value='${s}';sendChat()">${s}</button>`).join('')}</div></div>`;
    return;
  }
  box.innerHTML = S.chat.slice(-60).map(m=>`
    <div class="${m.who==='user'?'ml-8':'msg-ai pl-3'}">
      <div class="${m.who==='user'?'msg-user p-3':'card p-3'}">
        <div class="text-[9px] tracking-widest mb-1 ${m.who==='user'?'':'gold'}">${m.who==='user'?esc(S.profile.name).toUpperCase():esc(m.mode.toUpperCase())}</div>
        <div class="text-[13px] leading-relaxed" style="color:#d8d2c6">${m.html}</div>
      </div></div>`).join('');
  box.scrollTop = box.scrollHeight;
}
function sendChat(){
  const inp=$('chat-in'); const q=inp.value.trim(); if(!q) return;
  inp.value='';
  S.chat.push({who:'user', mode:MODE_META[aiMode].name, html:esc(q), t:Date.now()});
  save(); paintChat();
  setTimeout(()=>{
    const r = mentorReply(q, aiMode);
    S.chat.push({who:'ai', mode:MODE_META[aiMode].name, html:r, t:Date.now()});
    save(); paintChat();
  }, 500);
}
function mentorReply(q, mode){
  const low=q.toLowerCase();
  const hs=habitStats(), np=neetProgress(), wk=weakAreas();
  const ctx = `Current data — discipline today: <b>${hs.score}%</b> (${hs.done}/${hs.total}), streak: <b>${hs.streak} days</b>, NEET syllabus secured: <b>${np.pct}%</b>${wk.length?`, weakest: <b>${esc(wk[0].chap)}</b> (${wk[0].pct}%)`:''}, tests logged: <b>${S.tests.length}</b>.`;
  const sections=[];
  if(mode==='professor'||mode==='combined') sections.push(profReply(low,ctx,hs,np,wk));
  if(mode==='berlin'||mode==='combined') sections.push(berlinReply(low,ctx,hs));
  if(mode==='ali'||mode==='combined') sections.push(aliReply(low,ctx,hs));
  return sections.join('<br><br>');
}
function profReply(low,ctx,hs,np,wk){
  if(/test|score|mock|analy/.test(low)){
    if(!S.tests.length) return `<span class="gold">🎓 PROFESSOR</span><br>No test data yet — analysis needs numbers. Log your last mock in <b>NEET → Tests</b> and I will tell you exactly what to fix first.`;
    const t=S.tests[S.tests.length-1];
    const subs=[['Physics',t.phy,180],['Chemistry',t.chem,180],['Biology',t.bio,360]].sort((a,b)=>(a[1]/a[2])-(b[1]/b[2]));
    return `<span class="gold">🎓 PROFESSOR</span><br>Last test: <b>${t.total}/720</b>. Weakest subject: <b>${subs[0][0]}</b> at ${Math.round(subs[0][1]/subs[0][2]*100)}%. ${ctx}<br><br>Directive: next three study blocks go to ${subs[0][0]}. Accuracy at ${t.acc}% — ${t.acc<75?'reduce attempts, increase certainty per question':'accuracy is a weapon; now raise attempt speed'}. Every mistake you log in the notebook is one the paper cannot repeat.`;
  }
  if(/plan|schedule|study|routine|today/.test(low)){
    const target = wk[0]? wk[0].chap : 'your next unstarted chapter';
    return `<span class="gold">🎓 PROFESSOR</span><br>${ctx}<br><br>Today's optimal plan: ① ${esc(target)} — one 45-min deep block now. ② Active recall close — 10 min, closed book. ③ Log the chapter percentage honestly. ④ Weakest-subject test questions ×15 before sleep. One chapter mastered beats five chapters touched.`;
  }
  if(/quit|give up|motivat|tired|lazy|can'?t/.test(low))
    return `<span class="gold">🎓 PROFESSOR</span><br>Quitting is also a decision — with a guaranteed outcome. ${ctx}<br><br>Reframe: your ${hs.streak}-day streak was built on ordinary days, not heroic ones. Reduce today's load by half, but keep the chain unbroken. Consistency is a compounding asset; you are not starting over, you are protecting principal.`;
  if(/confus|decision/.test(low))
    return `<span class="gold">🎓 PROFESSOR</span><br>Decision protocol: write the question in one sentence. List options. For each, note reversibility and the cost of being wrong. Choose the option with the best worst-case. Then act within 24 hours — undecided options decay in value daily.`;
  return `<span class="gold">🎓 PROFESSOR</span><br>${ctx}<br><br>Strategic read: your constraint is execution, not information. Pick the single highest-leverage action — ${wk.length?`revising <b>${esc(wk[0].chap)}</b>`:'logging your next test'} — and finish it before anything recreational. Tell me "plan my day" for a full schedule.`;
}
function berlinReply(low,ctx,hs){
  if(/disrespect|insult|mock|angry|revenge/.test(low))
    return `<span style="color:#c9a962">🎭 BERLIN</span><br>They disrespected a moment. Do not let them own your week. The response that dominates is <b>no response</b> — then outperform them at the thing that matters. Slow voice, level eyes, short sentences. Revenge is for amateurs; results are for professionals. Never cruel, never manipulated — just unshakeable.`;
  if(/confiden|shy|afraid|scared|girl|friend|social|talk/.test(low))
    return `<span style="color:#c9a962">🎭 BERLIN</span><br>Confidence is a rehearsal, not a gift. This week's drill: the Slow Reply — wait two seconds before every answer, shoulders back, voice one register lower. One brief exchange with a stranger daily. You will feel theatrical for ten days; on day eleven it will simply be you. Charisma is presence practised until it becomes posture.`;
  if(/quit|give up|motivat|tired/.test(low))
    return `<span style="color:#c9a962">🎭 BERLIN</span><br>Feelings negotiate; identity decides. You do not ask a mood for permission — you inform it of the schedule. Stand up now. Chest open, chin level. Do the next mission at 80% intensity. A man who keeps moving on ordinary days becomes unavoidable on extraordinary ones.`;
  return `<span style="color:#c9a962">🎭 BERLIN</span><br>${ctx}<br><br>Presence note: discipline at ${hs.score}% today — carry it visibly. Groom sharp, walk slow, speak less. People believe the body before the words. Today's exercise: disagree with one person clearly, without apologising for existing.`;
}
function aliReply(low,ctx,hs){
  const w=WISDOM[parseInt(todayStr().replace(/-/g,''))%WISDOM.length];
  if(/sad|alone|cry|heart|pain|dua|pray/.test(low))
    return `<span class="gold">🕌 MOLA ALI</span><br>Heavy heart, straight back. "Allah does not burden a soul beyond what it can bear" (Qur'an 2:286). Pain endured with sabr is not wasted — it is being weighed in your favour. Pray first, act second, speak last. And remember Ali's words: patience over what pains you, and patience against what you desire. You carry both tonight.`;
  if(/angry|revenge|hate|disrespect/.test(low))
    return `<span class="gold">🕌 MOLA ALI</span><br>"The tongue is like a lion — if you let it loose, it wounds" (attributed, Nahj al-Balagha tradition). Your anger is a fire; answer injustice with excellence instead. The one who wronged you cannot reach your rank — do not descend to theirs. Win quietly. Justice will keep its own ledger.`;
  if(/quit|give up|hopeless/.test(low))
    return `<span class="gold">🕌 MOLA ALI</span><br>"Your remedy is within you, yet you do not perceive it" (Nahj al-Balagha, Sermon 185). The despair you feel is a test of sincerity, not a measure of your worth. Do wudu, pray two units, then complete the smallest mission. Knowledge — your true wealth — guards its possessor. This night will pass; what you build in it will not.`;
  return `<span class="gold">🕌 MOLA ALI</span><br>Today's teaching: <i>"${esc(w.t.slice(0,120))}…"</i> <span style="color:#8a8a94">(${esc(w.tag)})</span><br><br>Meaning: ${esc(w.meaning)}<br>Implement: ${esc(w.action)}<br><br>${ctx} — let the day's numbers testify for you tonight.`;
}

function saveProfile(){ S.profile.name=$('pf-name').value.trim()||'Zaffar'; S.profile.neetDate=$('pf-neet').value||'2027-05-03'; save(); $('hdr-initial').textContent=S.profile.name[0].toUpperCase(); toast('Identity parameters saved'); }
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='zaffar-backup-'+todayStr()+'.json'; a.click();
  toast('Backup exported');
}
function importData(inp){
  const f=inp.files[0]; if(!f) return; const r=new FileReader();
  r.onload=e=>{ try{ S=Object.assign(defState(),JSON.parse(e.target.result)); save(); location.reload(); }catch(err){ toast('Invalid backup file'); } };
  r.readAsText(f);
}
function wipeData(){ if(confirm('Erase all progress and reset the system?')){ localStorage.removeItem(LS_KEY); location.reload(); } }

/* ============ NOTIFICATIONS ============ */
function enableNotifs(){
  if(!('Notification' in window)) return toast('Notifications not supported here');
  Notification.requestPermission().then(p=>{
    toast(p==='granted'?'Device notifications armed':'Permission denied — reminders stay in-app');
    if(p==='granted') scheduleNotifs();
  });
}
function scheduleNotifs(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  setInterval(()=>{
    const now=new Date(); const hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    if(S.notif.morning && hm===S.profile.wake) notify('ZAFFAR', 'Good morning. Your next version is built by what you do today.');
    if(S.notif.study && (hm==='06:30'||hm==='14:00')) notify('ZAFFAR — Study Block', 'Enter deep work. Weakest chapter first.');
    if(S.notif.workout && hm==='17:00') notify('PROJECT MORITZ', 'Training time. Shoulders and posture carry the silhouette.');
    if(S.notif.skincare && hm==='21:30') notify('ZAFFAR — Grooming', 'Skincare, sunscreen check, hair. Details compound.');
    if(S.notif.wisdom && hm==='08:00') notify('Wisdom of Mola Ali (A.S.)', 'Today\'s lesson is waiting in the Spiritual Corner.');
    if(S.notif.evening && hm==='22:30') notify('THE DAILY AUDIT', 'Close the day honestly. Six questions await.');
  }, 30000);
}
function notify(title, body){ try{ new Notification(title,{body}); }catch(e){} }
